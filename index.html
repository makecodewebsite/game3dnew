<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YASUO VS YI: LIGHTWEIGHT EDITION</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body, html { 
            margin: 0; padding: 0; overflow: hidden; height: 100%; width: 100%;
            background-color: #1a1a2e;
            background-image: url('nen.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            user-select: none; touch-action: none;
        }
        
        #mode-selector {
            position: absolute; inset: 0; background: rgba(10, 15, 20, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        .btn-mode {
            background: rgba(255,255,255,0.1); border: 2px solid #fff; color: white;
            padding: 15px 40px; margin: 10px; font-size: 1.2rem; border-radius: 5px;
            cursor: pointer; width: 300px; font-weight: bold;
        }

        #game-ui { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 10; }
        
        .top-bars { position: absolute; top: 15px; left: 20px; right: 20px; display: flex; justify-content: space-between; }
        .player-stats, .enemy-stats { width: 40%; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; border: 2px solid #555; }
        .enemy-stats { border-color: #8b0000; text-align: right; }
        
        .stat-name { color: white; font-weight: bold; margin-bottom: 5px; font-size: 13px; text-shadow: 1px 1px 2px black; }
        .stat-details { color: #aaa; font-size: 11px; margin-bottom: 5px; }
        
        .bar-bg { width: 100%; height: 16px; background: #222; border: 1px solid #000; margin-bottom: 5px; position: relative; }
        .hp-fill { height: 100%; background: linear-gradient(90deg, #cc0000, #ff3333); width: 100%; transition: width 0.2s; }
        .mana-bg { width: 100%; height: 8px; background: #222; border: 1px solid #000; position: relative;}
        .mana-fill { height: 100%; background: linear-gradient(90deg, #0066cc, #00aaff); width: 0%; transition: width 0.2s; }

        #mobile-controls { display: none; pointer-events: auto; }
        
        .move-group { position: absolute; bottom: 20px; left: 30px; width: 140px; height: 130px; }
        .btn-move { 
            position: absolute; width: 60px; height: 60px; 
            background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); 
            border-radius: 50%; display: flex; justify-content: center; align-items: center; 
            color: white; font-size: 20px; font-weight: bold; backdrop-filter: blur(2px);
        }
        #btn-jump { top: 0; left: 35px; }
        #btn-left { bottom: 0; left: 0; } 
        #btn-right { bottom: 0; right: 0; } 

        .action-group { position: absolute; bottom: 20px; right: 30px; display: flex; gap: 15px; align-items: flex-end; }
        .btn-action { 
            width: 70px; height: 70px; background: rgba(255,255,255,0.15); 
            border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            color: white; font-weight: bold; backdrop-filter: blur(2px);
        }
        #btn-dash { width: 60px; height: 60px; font-size: 13px; }
        #btn-attack { width: 85px; height: 85px; background: rgba(255,0,0,0.4); border-color: #ff3333; font-size: 16px;}
        #btn-ult { 
            position: absolute; top: -85px; right: 0; 
            background: rgba(0,150,255,0.5); border-color: #00aaff; display: none; box-shadow: 0 0 15px #00aaff;
        }

        #upgrade-menu {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 10, 15, 0.98); border: 2px solid #ffcc00; padding: 20px;
            display: none; z-index: 20; color: white; text-align: center; border-radius: 8px; pointer-events: auto; width: 340px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .up-item { margin: 10px 0; padding: 8px; background: rgba(255,255,255,0.1); border-radius: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 14px;}
        .btn-buy { background: #ffcc00; border: none; padding: 6px 12px; font-weight: bold; border-radius: 3px; cursor: pointer; color: black;}
        
        .jump-box { margin-top: 15px; padding-top: 15px; border-top: 1px solid #555; display: flex; justify-content: space-between; align-items: center;}
        .jump-box input { width: 60px; padding: 5px; background: #222; border: 1px solid #fff; color: white; text-align: center; font-weight: bold;}
        .jump-box button { background: #ff3333; border: none; padding: 6px 12px; font-weight: bold; color: white; cursor: pointer; border-radius: 3px; }

        #custom-alert {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; pointer-events: auto;
        }
        .alert-box {
            background: #222; border: 2px solid #fff; padding: 30px; border-radius: 10px;
            text-align: center; color: white; min-width: 300px;
        }
        .alert-box button { margin-top: 20px; padding: 10px 30px; background: #ffcc00; color: black; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="custom-alert">
        <div class="alert-box">
            <h3 id="alert-msg">Thông báo</h3>
            <button onclick="closeAlert()">OK</button>
        </div>
    </div>

    <div id="mode-selector">
        <h2 style="color: white; text-shadow: 2px 2px 5px black;">YASUO VS MASTER YI<br><span style="font-size:14px; color:#00ffcc;">(PHIÊN BẢN TỐC ĐỘ CAO)</span></h2>
        <button class="btn-mode" onclick="toggleFullScreen()" style="background: rgba(230, 126, 34, 0.5); border-color: #e67e22;">🔲 BẬT TOÀN MÀN HÌNH</button>
        <button class="btn-mode" onclick="startGame('MOBILE')">📱 CHƠI TRÊN ĐIỆN THOẠI</button>
        <button class="btn-mode" onclick="startGame('PC')">💻 CHƠI TRÊN PC</button>
    </div>

    <div id="game-ui">
        <div class="top-bars">
            <div class="player-stats">
                <div class="stat-name">SẾP YASUO</div>
                <div class="stat-details">HP: <span id="hp-text">100</span> | ST: <span id="atk-text">25</span> | GIÁP: <span id="arm-text">30</span></div>
                <div class="bar-bg"><div class="hp-fill" id="hp-bar"></div></div>
                <div class="mana-bg"><div class="mana-fill" id="mana-bar"></div></div>
            </div>
            
            <div class="enemy-stats">
                <div class="stat-name">MASTER YI (ẢI <span id="stage-text">1</span>)</div>
                <div class="stat-details">HP: <span id="e-hp-text">100</span> | ST: <span id="e-atk-text">15</span> | GIÁP: <span id="e-arm-text">10</span></div>
                <div class="bar-bg"><div class="hp-fill" id="enemy-hp-bar" style="background: linear-gradient(90deg, #8b0000, #ff0000);"></div></div>
                <div class="mana-bg"><div class="mana-fill" id="enemy-mana-bar" style="float: right; background: linear-gradient(-90deg, #0066cc, #00aaff);"></div></div>
            </div>
        </div>
    </div>

    <div id="mobile-controls">
        <div class="move-group">
            <div class="btn-move" id="btn-jump">W</div>
            <div class="btn-move" id="btn-left">A</div>
            <div class="btn-move" id="btn-right">D</div>
        </div>
        <div class="action-group">
            <div class="btn-action" id="btn-ult">SKILL</div>
            <div class="btn-action" id="btn-dash">LƯỚT</div>
            <div class="btn-action" id="btn-attack">CHÉM</div>
        </div>
    </div>

    <div id="upgrade-menu">
        <h3 id="stage-cleared" style="color: #ffcc00; margin-top: 0;">ẢI 1 HOÀN THÀNH!</h3>
        <div style="color: #fff; margin-bottom: 10px; font-size: 16px;">Vàng: <span id="gold-text" style="color:#ffcc00; font-weight:bold;">0</span>G</div>
        <div class="up-item"><span>+15 ST (<span id="c-atk">50</span>G)</span><button class="btn-buy" onclick="buy('atk')">MUA</button></div>
        <div class="up-item"><span>+50 Máu (<span id="c-hp">50</span>G)</span><button class="btn-buy" onclick="buy('hp')">MUA</button></div>
        <div class="up-item"><span>+5 Giáp (<span id="c-arm">100</span>G)</span><button class="btn-buy" onclick="buy('arm')">MUA</button></div>
        <div class="jump-box">
            <span>Nhảy đến Ải:</span>
            <input type="number" id="jump-val" value="5" min="2">
            <button onclick="jumpStage()">NHẢY</button>
        </div>
        <button onclick="resumeGame()" style="width:100%; margin-top:15px; padding:10px; background: #28a745; color:white; border:none; font-weight:bold; border-radius: 4px;">TIẾP TỤC CHIẾN ĐẤU</button>
    </div>

    <script>
        let alertCallback = null;
        function showAlert(msg, callback) {
            document.getElementById('alert-msg').innerText = msg;
            document.getElementById('custom-alert').style.display = 'flex';
            alertCallback = callback;
        }
        function closeAlert() {
            document.getElementById('custom-alert').style.display = 'none';
            if(alertCallback) alertCallback();
        }

        function toggleFullScreen() {
            let doc = window.document; let docEl = doc.documentElement;
            if(!doc.fullscreenElement) {
                if(docEl.requestFullscreen) docEl.requestFullscreen().catch(err => console.log(err));
            } else {
                if(doc.exitFullscreen) doc.exitFullscreen();
            }
        }

        let scene, camera, renderer, player, enemy;
        
        let keys = { left: false, right: false };
        let isJumping = false, velocityY = 0;
        let isEnemyJumping = false, enemyVelocityY = 0;
        let isAttacking = false, isEnemyAttacking = false;
        
        let isDead = false, isEnemyDead = false, isMenuOpen = false; 
        let isDashing = false, dashFrames = 0, dashDir = 1;

        let pStats = { hp: 100, maxHp: 100, armor: 30, mana: 0, atk: 25, gold: 0, stage: 1 };
        let eStats = { hp: 100, maxHp: 100, armor: 10, mana: 0, atk: 15, speed: 0.08, aggro: 0.02 };
        let costs = { atk: 50, hp: 50, arm: 100 };

        function startGame(mode) {
            document.getElementById('mode-selector').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            
            if(mode === 'MOBILE') {
                document.getElementById('mobile-controls').style.display = 'block';
                setupMobile();
            } else {
                window.onkeydown = (e) => {
                    if(isMenuOpen) return;
                    if(e.key === 'a' || e.key === 'A') keys.left = true;
                    if(e.key === 'd' || e.key === 'D') keys.right = true;
                    if(e.key === 'w' || e.key === 'W') doJump();
                    if(e.key === 'j' || e.key === 'J') doAtk();
                    if(e.key === 'k' || e.key === 'K') doDash();
                    if(e.key === 'u' || e.key === 'U') doUlt();
                };
                window.onkeyup = (e) => {
                    if(e.key === 'a' || e.key === 'A') keys.left = false;
                    if(e.key === 'd' || e.key === 'D') keys.right = false;
                };
            }
            init3D(); // Tải cái là xong luôn, không cần loading screen
            updateUI();
            loop();
        }

        function setupMobile() {
            const bind = (id, key, func) => {
                let btn = document.getElementById(id);
                btn.ontouchstart = (e) => { e.preventDefault(); if(isMenuOpen) return; btn.style.transform="scale(0.85)"; if(key) keys[key]=true; if(func) func(); };
                btn.ontouchend = (e) => { e.preventDefault(); btn.style.transform="scale(1)"; if(key) keys[key]=false; };
            };
            bind('btn-left', 'left'); bind('btn-right', 'right');
            bind('btn-jump', null, doJump); bind('btn-attack', null, doAtk); 
            bind('btn-dash', null, doDash); bind('btn-ult', null, doUlt);
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = null; 

            camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 16); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.0));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 5); 
            scene.add(dirLight);

            // TẠO NHÂN VẬT BẰNG KHỐI NHẸ HỀU (TẢI 0.001 GIÂY)
            // Sếp có thể dán ảnh PNG vào thuộc tính map của MeshStandardMaterial sau này
            const playerGeo = new THREE.BoxGeometry(1.5, 3.5, 1.5);
            const playerMat = new THREE.MeshStandardMaterial({ color: 0x00aaff }); // Màu Xanh
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(0, 1.75, 0); // Đứng trên mặt đất
            scene.add(player);

            const enemyGeo = new THREE.BoxGeometry(1.5, 3.8, 1.5); // Bot Yi cao hơn xíu
            const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff3333 }); // Màu Đỏ
            enemy = new THREE.Mesh(enemyGeo, enemyMat);
            enemy.position.set(7, 1.9, 0);
            scene.add(enemy);
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // HÀM MÔ PHỎNG HOẠT ẢNH BẰNG CODE VẬT LÝ (KHÔNG CẦN FILE GLB)
        function animAttack(target) {
            const obj = (target === 'player') ? player : enemy;
            const originalZ = obj.rotation.z;
            const tilt = (target === 'player') ? -0.5 : 0.5; // Nghiêng người về phía trước
            obj.rotation.z = tilt;
            setTimeout(() => { if(obj) obj.rotation.z = originalZ; }, 200);
        }

        function animDeath(target) {
            const obj = (target === 'player') ? player : enemy;
            obj.rotation.z = (target === 'player') ? -Math.PI/2 : Math.PI/2; // Ngã lăn ra đất
            obj.position.y = 0.75; 
        }

        function doJump() { if(!isJumping && !isAttacking && !isDead && !isMenuOpen) { isJumping = true; velocityY = 0.35; } }
        
        function doDash() {
            if(isDashing || isDead || isMenuOpen) return;
            isDashing = true; dashFrames = 10; dashDir = (enemy && player.position.x < enemy.position.x) ? 1 : -1;
            player.rotation.z = dashDir * -0.3; // Nghiêng người khi lướt
        }

        function calcDamage(rawAtk, targetArmor) { return rawAtk * (100 / (100 + targetArmor)); }

        function triggerEnemyDeath() {
            if(isEnemyDead) return;
            isEnemyDead = true;
            animDeath('enemy');
            setTimeout(() => {
                scene.remove(enemy);
                let goldDrop = Math.floor(50 * Math.pow(1.5, pStats.stage - 1));
                pStats.gold += goldDrop;
                document.getElementById('gold-text').innerText = pStats.gold;
                document.getElementById('stage-cleared').innerText = "ẢI " + pStats.stage + " HOÀN THÀNH!";
                document.getElementById('upgrade-menu').style.display = 'block';
                isMenuOpen = true; 
            }, 1000);
        }

        function checkPlayerDeath() {
            updateUI();
            if(pStats.hp <= 0 && !isDead) {
                isDead = true;
                animDeath('player');
                setTimeout(() => {
                    showAlert("BẠN ĐÃ TỬ TRẬN!\nHãy mua thêm chỉ số để phục thù!", () => {
                        document.getElementById('upgrade-menu').style.display = 'block';
                        document.getElementById('stage-cleared').innerText = "THẤT BẠI TẠI ẢI " + pStats.stage;
                        isMenuOpen = true; 
                    });
                }, 1000);
            }
        }

        function doAtk() {
            if(isAttacking || isDead || isDashing || isMenuOpen) return;
            isAttacking = true;
            animAttack('player');
            setTimeout(() => {
                if(enemy && !isEnemyDead && Math.abs(player.position.x - enemy.position.x) < 4.0) {
                    eStats.hp -= calcDamage(pStats.atk, eStats.armor);
                    pStats.mana = Math.min(100, pStats.mana + 20);
                    enemy.position.x += (player.position.x < enemy.position.x ? 1.5 : -1.5);
                    if(eStats.hp <= 0) triggerEnemyDeath();
                }
                updateUI();
            }, 100); // Chém cực nhanh không cần chờ animation
            setTimeout(() => { isAttacking = false; }, 300);
        }

        function doUlt() {
            if(pStats.mana < 100 || isAttacking || isDead || isMenuOpen) return;
            isAttacking = true;
            animAttack('player');
            setTimeout(() => {
                if(enemy && !isEnemyDead && Math.abs(player.position.x - enemy.position.x) < 8.0) { 
                    eStats.hp -= calcDamage(pStats.atk * 4, eStats.armor);
                    pStats.mana = 0;
                    enemy.position.x += (player.position.x < enemy.position.x ? 3 : -3);
                    if(eStats.hp <= 0) triggerEnemyDeath();
                }
                updateUI();
            }, 200);
            setTimeout(() => { isAttacking = false; }, 600);
        }

        function updateUI() {
            document.getElementById('hp-text').innerText = Math.max(0, Math.floor(pStats.hp));
            document.getElementById('atk-text').innerText = pStats.atk;
            document.getElementById('arm-text').innerText = pStats.armor;
            document.getElementById('e-hp-text').innerText = Math.max(0, Math.floor(eStats.hp));
            document.getElementById('e-atk-text').innerText = eStats.atk;
            document.getElementById('e-arm-text').innerText = eStats.armor;
            document.getElementById('stage-text').innerText = pStats.stage;
            document.getElementById('hp-bar').style.width = (pStats.hp/pStats.maxHp*100)+'%';
            document.getElementById('mana-bar').style.width = pStats.mana+'%';
            document.getElementById('enemy-hp-bar').style.width = Math.max(0, (eStats.hp/eStats.maxHp*100))+'%';
            document.getElementById('enemy-mana-bar').style.width = eStats.mana+'%';
            document.getElementById('btn-ult').style.display = (pStats.mana >= 100) ? 'flex' : 'none';
            document.getElementById('c-atk').innerText = costs.atk;
            document.getElementById('c-hp').innerText = costs.hp;
            document.getElementById('c-arm').innerText = costs.arm;
        }

        function buy(type) {
            if(pStats.gold < costs[type]) { showAlert("Cày thêm tiền đi sếp, không đủ vàng rồi!", null); return; }
            pStats.gold -= costs[type]; document.getElementById('gold-text').innerText = pStats.gold;
            if(type === 'atk') pStats.atk += 15;
            if(type === 'hp') { pStats.maxHp += 50; pStats.hp = pStats.maxHp; }
            if(type === 'arm') pStats.armor += 5; 
            costs[type] = Math.floor(costs[type] * 1.5);
            updateUI();
        }

        function buildBotStats(level) {
            eStats.maxHp = Math.floor(100 * Math.pow(1.3, level - 1)); eStats.hp = eStats.maxHp; 
            eStats.atk = Math.floor(15 * Math.pow(1.15, level - 1)); eStats.armor = Math.floor(10 + (level * 5)); eStats.mana = 0;
            eStats.speed = Math.min(0.2, 0.04 + (level * 0.005)); eStats.aggro = Math.min(0.1, 0.02 + (level * 0.002));
        }

        function jumpStage() {
            let val = parseInt(document.getElementById('jump-val').value);
            if(isNaN(val) || val <= pStats.stage) { showAlert("Vui lòng nhập số ải lớn hơn ải hiện tại!", null); return; }
            pStats.stage = val; buildBotStats(val);
            showAlert("Đã sẵn sàng nhảy tới ải " + val + " khi sếp bấm Tiếp Tục!", null);
        }

        function resumeGame() {
            document.getElementById('upgrade-menu').style.display = 'none';
            pStats.hp = pStats.maxHp; isMenuOpen = false; 
            if(isDead) { 
                isDead = false; 
                player.rotation.z = 0; player.position.y = 1.75; // Đứng dậy
            } else { 
                pStats.stage++; 
            }
            buildBotStats(pStats.stage); isEnemyDead = false;
            
            if(!scene.children.includes(enemy)) { scene.add(enemy); }
            enemy.rotation.z = 0; enemy.position.y = 1.9; // Bot đứng dậy
            enemy.position.x = player.position.x + 8; 
            isEnemyAttacking = false;
            updateUI();
        }

        function loop() {
            requestAnimationFrame(loop);
            if(isMenuOpen) { renderer.render(scene, camera); return; }

            if(player && !isDead) {
                if(isDashing) {
                    player.position.x += dashDir * 0.75; dashFrames--;
                    if(dashFrames <= 0) { isDashing = false; player.rotation.z = 0; }
                } else if(!isAttacking) {
                    if(keys.left) { player.position.x -= 0.18; } // Tốc độ di chuyển nhanh hơn
                    if(keys.right) { player.position.x += 0.18; }
                }

                if(isJumping) { 
                    player.position.y += velocityY; velocityY -= 0.02; 
                    if(player.position.y <= 1.75) { player.position.y = 1.75; isJumping = false; velocityY = 0; } 
                }

                camera.position.x = player.position.x;
                
                if(enemy && !isEnemyDead && eStats.hp > 0) {
                    let dist = Math.abs(player.position.x - enemy.position.x);
                    let dir = player.position.x > enemy.position.x ? 1 : -1;

                    if(isEnemyJumping) { 
                        enemy.position.y += enemyVelocityY; enemyVelocityY -= 0.02; 
                        if(enemy.position.y <= 1.9) { enemy.position.y = 1.9; isEnemyJumping = false; enemyVelocityY = 0; } 
                    }

                    if(!isEnemyAttacking) {
                        if(eStats.mana >= 100) {
                            isEnemyAttacking = true; animAttack('enemy');
                            setTimeout(() => {
                                if(!isDead && Math.abs(player.position.x - enemy.position.x) < 8) {
                                    pStats.hp -= calcDamage(eStats.atk * 4, pStats.armor);
                                    player.position.x += (player.position.x < enemy.position.x ? -3 : 3);
                                    checkPlayerDeath();
                                }
                            }, 200);
                            setTimeout(() => { isEnemyAttacking = false; eStats.mana = 0; updateUI(); }, 600);
                        }
                        else if(dist > 2.5) { 
                            enemy.position.x += dir * eStats.speed * 2; // Bot chạy nhanh hơn
                        }
                        else if(dist <= 3.5 && Math.random() < 0.015 && !isEnemyJumping) { isEnemyJumping = true; enemyVelocityY = 0.35; }
                        else if(dist <= 2.5 && Math.random() < eStats.aggro) {
                            isEnemyAttacking = true; animAttack('enemy');
                            setTimeout(() => {
                                if(!isDead && Math.abs(player.position.x - enemy.position.x) <= 3) {
                                    pStats.hp -= calcDamage(eStats.atk, pStats.armor); eStats.mana = Math.min(100, eStats.mana + 25);
                                    checkPlayerDeath();
                                }
                            }, 100);
                            setTimeout(() => { isEnemyAttacking = false; }, 400);
                        }
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
