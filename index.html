<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG Project - Hero Management</title>
    <style>
        :root { --ur: #ff3e3e; --ssr: #ffcc00; --sr: #c63eff; --r: #3ea6ff; }
        body { margin: 0; background: #0a0a0f; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* HEADER STATS */
        .header { width: 100%; max-width: 600px; padding: 15px; background: #15151f; display: flex; justify-content: space-around; border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 100; }
        .stat-box { text-align: center; }
        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }
        .stat-value { font-weight: bold; color: #ffcc00; display: block; }
        #total-power { color: #00ffcc; font-size: 1.2rem; }

        /* TABS */
        .tabs { display: flex; width: 100%; max-width: 600px; background: #1a1a25; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; color: #888; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: white; border-bottom-color: #ffcc00; background: rgba(255,204,0,0.05); }

        .screen { width: 100%; max-width: 600px; display: none; padding: 20px; box-sizing: border-box; }
        .screen.active { display: block; }

        /* GACHA DISPLAY */
        #result-display { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 20px 0; }
        .card { width: 70px; height: 90px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); }

        /* INVENTORY LIST */
        .hero-list { display: flex; flex-direction: column; gap: 10px; }
        .hero-item { background: #1a1a25; padding: 12px; border-radius: 10px; display: flex; align-items: center; gap: 15px; border-left: 5px solid #333; }
        .hero-info { flex-grow: 1; }
        .hero-name { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
        .hero-lvl { font-size: 12px; color: #00ffcc; }
        .btn-up { background: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        .rarity-ur { background: #440000; border-color: var(--ur); color: var(--ur); }
        .rarity-ssr { background: #443300; border-color: var(--ssr); color: var(--ssr); }
        .rarity-sr { background: #220044; border-color: var(--sr); color: var(--sr); }
        .rarity-r { background: #002244; border-color: var(--r); color: var(--r); }

        .btn-main { padding: 15px 25px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; margin: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="stat-box"><span class="stat-label">Lực Chiến</span><span id="total-power" class="stat-value">0</span></div>
        <div class="stat-box"><span class="stat-label">Kim Cương</span><span id="gems" class="stat-value">5000</span></div>
        <div class="stat-box"><span class="stat-label">Vàng</span><span id="gold" class="stat-value">10000</span></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('gacha')">TRIỆU HỒI</button>
        <button class="tab-btn" onclick="openTab('inventory')">KHO TƯỚNG</button>
    </div>

    <div id="gacha" class="screen active">
        <div id="result-display"><p style="color:#555">Kết quả triệu hồi sẽ hiện ở đây...</p></div>
        <div style="text-align: center;">
            <button class="btn-main" style="background:#eee" onclick="summon(1)">X1 (300💎)</button>
            <button class="btn-main" style="background:#ffcc00" onclick="summon(10)">X10 (2700💎)</button>
        </div>
    </div>

    <div id="inventory" class="screen">
        <div class="hero-list" id="hero-list-ui">
            </div>
    </div>

    <script>
        let userData = { gems: 5000, gold: 10000, pity: 0, myHeroes: [] };

        const HERO_DATA = {
            UR: { names: ["Sát Thủ Rồng", "Thần Kiếm"], basePower: 2500 },
            SSR: { names: ["Chiến Binh Thép", "Cung Thủ"], basePower: 1200 },
            SR: { names: ["Kiếm Khách", "Sát Thủ"], basePower: 500 },
            R: { names: ["Lính Gác", "Thợ Săn"], basePower: 100 }
        };

        function openTab(tabId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            if(tabId === 'inventory') renderInventory();
        }

        function updateUI() {
            document.getElementById('gems').innerText = userData.gems;
            document.getElementById('gold').innerText = userData.gold;
            
            let totalPower = userData.myHeroes.reduce((sum, h) => sum + (h.power + (h.level * 50)), 0);
            document.getElementById('total-power').innerText = totalPower.toLocaleString();
        }

        function summon(times) {
            const cost = times === 10 ? 2700 : 300;
            if (userData.gems < cost) return alert("Không đủ Kim Cương!");

            userData.gems -= cost;
            const display = document.getElementById('result-display');
            display.innerHTML = "";

            for (let i = 0; i < times; i++) {
                userData.pity++;
                let rand = Math.random() * 100;
                let rarity = "R";
                
                if (userData.pity >= 10 || rand < 25) {
                    if (rand < 1) rarity = "UR";
                    else if (rand < 5) rarity = "SSR";
                    else rarity = "SR";
                    userData.pity = 0;
                }

                let name = HERO_DATA[rarity].names[Math.floor(Math.random() * HERO_DATA[rarity].names.length)];
                let newHero = { id: Date.now() + i, name, rarity, level: 1, power: HERO_DATA[rarity].basePower };
                
                userData.myHeroes.push(newHero);
                
                let card = document.createElement('div');
                card.className = `card rarity-${rarity.toLowerCase()}`;
                card.innerHTML = `<span>${rarity}</span><div style="text-align:center">${name}</div>`;
                display.appendChild(card);
            }
            updateUI();
        }

        function renderInventory() {
            const listUI = document.getElementById('hero-list-ui');
            listUI.innerHTML = userData.myHeroes.length === 0 ? "<p>Chưa có tướng nào, đi quay đi sếp!</p>" : "";

            userData.myHeroes.sort((a,b) => b.power - a.power).forEach(hero => {
                let item = document.createElement('div');
                item.className = "hero-item";
                item.style.borderLeftColor = `var(--${hero.rarity.toLowerCase()})`;
                item.innerHTML = `
                    <div class="hero-info">
                        <div class="hero-name">${hero.name} <span style="color:var(--${hero.rarity.toLowerCase()})">[${hero.rarity}]</span></div>
                        <div class="hero-lvl">Cấp: ${hero.level} | Công: ${hero.power + (hero.level * 50)}</div>
                    </div>
                    <button class="btn-up" onclick="upgradeHero(${hero.id})">NÂNG CẤP (500💰)</button>
                `;
                listUI.appendChild(item);
            });
        }

        function upgradeHero(id) {
            if (userData.gold < 500) return alert("Hết vàng rồi sếp!");
            let hero = userData.myHeroes.find(h => h.id === id);
            if (hero) {
                userData.gold -= 500;
                hero.level++;
                renderInventory();
                updateUI();
            }
        }

        updateUI();
    </script>
</body>
</html>
