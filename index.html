<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gacha System - RPG Project</title>
    <style>
        :root {
            --ur: #ff3e3e; --ssr: #ffcc00; --sr: #c63eff; --r: #3ea6ff;
        }
        body {
            margin: 0; background: #0a0a0f; color: white;
            font-family: 'Segoe UI', sans-serif; display: flex;
            flex-direction: column; align-items: center; height: 100vh; overflow: hidden;
        }
        #gacha-container {
            width: 100%; max-width: 500px; text-align: center; margin-top: 50px;
        }
        .stats-top { margin-bottom: 20px; font-size: 1.1rem; color: #ffcc00; }
        
        /* HIỂN THỊ KẾT QUẢ */
        #result-display {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 10px; min-height: 200px; padding: 20px;
            background: rgba(255,255,255,0.05); border-radius: 15px; margin: 20px;
        }
        .card {
            width: 80px; height: 110px; border-radius: 8px;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; font-weight: bold; font-size: 14px;
            animation: fadeIn 0.5s ease-out forwards; opacity: 0;
            border: 2px solid transparent; position: relative;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .rarity-ur { background: linear-gradient(135deg, #440000, var(--ur)); border-color: #ff9a9a; box-shadow: 0 0 15px var(--ur); }
        .rarity-ssr { background: linear-gradient(135deg, #443300, var(--ssr)); border-color: #fff3a3; box-shadow: 0 0 10px var(--ssr); }
        .rarity-sr { background: linear-gradient(135deg, #220044, var(--sr)); border-color: #e2a3ff; }
        .rarity-r { background: linear-gradient(135deg, #002244, var(--r)); border-color: #a3d5ff; }

        /* NÚT BẤM */
        .controls { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }
        .btn-gacha {
            padding: 15px 30px; border: none; border-radius: 30px;
            font-weight: bold; cursor: pointer; transition: 0.3s;
            background: #fff; color: #000; font-size: 16px;
        }
        .btn-gacha:active { transform: scale(0.9); }
        .btn-x10 { background: #ffcc00; }
        
        #pity-info { font-size: 12px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="gacha-container">
        <div class="stats-top">Kim Cương: <span id="gem-count">5000</span> 💎</div>
        
        <div id="result-display">
            <p id="placeholder">Sẵn sàng triệu hồi nhân vật...</p>
        </div>

        <div class="controls">
            <button class="btn-gacha" onclick="summon(1)">QUAY X1</button>
            <button class="btn-gacha btn-x10" onclick="summon(10)">QUAY X10</button>
        </div>
        
        <div id="pity-info">Bảo hiểm SR+: <span id="pity-count">10</span> lượt nữa</div>
    </div>

    <script>
        let gems = 5000;
        let pityCounter = 0; // Đếm để kích hoạt bảo hiểm
        
        const HEROES = {
            UR: ["Sát Thủ Rồng", "Thần Kiếm", "Pháp Sư Cổ"],
            SSR: ["Chiến Binh Thép", "Cung Thủ Ánh Sáng", "Hộ Vệ Hoàng Gia"],
            SR: ["Kiếm Khách", "Sát Thủ Bóng Đêm", "Y Sư"],
            R: ["Lính Gác", "Thợ Săn", "Dân Làng", "Tân Binh"]
        };

        function updateUI() {
            document.getElementById('gem-count').innerText = gems;
            document.getElementById('pity-count').innerText = 10 - pityCounter;
        }

        function summon(times) {
            const cost = times === 10 ? 2700 : 300; // Quay x10 được giảm giá
            if (gems < cost) {
                alert("Không đủ Kim Cương rồi sếp ơi!");
                return;
            }

            gems -= cost;
            const display = document.getElementById('result-display');
            display.innerHTML = ""; // Xóa kết quả cũ

            for (let i = 0; i < times; i++) {
                pityCounter++;
                let result;

                // Logic Gacha
                const rand = Math.random() * 100;
                
                if (pityCounter >= 10) {
                    // Kích hoạt bảo hiểm SR trở lên
                    result = getRarity(rand, true);
                    pityCounter = 0;
                } else {
                    result = getRarity(rand, false);
                    if (result.rarity === "SR" || result.rarity === "SSR" || result.rarity === "UR") {
                        pityCounter = 0;
                    }
                }
                
                createCard(result);
            }
            updateUI();
        }

        function getRarity(rand, isPity) {
            if (isPity) {
                if (rand < 5) return { rarity: "UR", name: HEROES.UR[Math.floor(Math.random() * HEROES.UR.length)] };
                if (rand < 20) return { rarity: "SSR", name: HEROES.SSR[Math.floor(Math.random() * HEROES.SSR.length)] };
                return { rarity: "SR", name: HEROES.SR[Math.floor(Math.random() * HEROES.SR.length)] };
            }

            if (rand < 1) return { rarity: "UR", name: HEROES.UR[Math.floor(Math.random() * HEROES.UR.length)] };
            if (rand < 5) return { rarity: "SSR", name: HEROES.SSR[Math.floor(Math.random() * HEROES.SSR.length)] };
            if (rand < 25) return { rarity: "SR", name: HEROES.SR[Math.floor(Math.random() * HEROES.SR.length)] };
            return { rarity: "R", name: HEROES.R[Math.floor(Math.random() * HEROES.R.length)] };
        }

        function createCard(hero) {
            const display = document.getElementById('result-display');
            const card = document.createElement('div');
            card.className = `card rarity-${hero.rarity.toLowerCase()}`;
            card.innerHTML = `
                <div style="font-size: 10px; margin-bottom: 5px;">${hero.rarity}</div>
                <div style="text-align:center">${hero.name}</div>
            `;
            display.appendChild(card);
        }
    </script>
</body>
</html>
