<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goku Web Game - Mobile Version</title>
    <style>
        /* CHẶN COPY VÀ QUÉT KHỐI */
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
            color: #fff;
            overflow: hidden; 
            -webkit-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
            -webkit-touch-callout: none; 
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(#87CEEB 60%, #8BC34A 40%);
            position: relative;
        }

        #player {
            width: 250px;  
            height: 150px;
            position: absolute;
            bottom: 10%; 
            left: 50px;
            background-image: url('stand_1.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom left;
            transition: left 0.1s linear, bottom 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* MÀN HÌNH KHỞI ĐỘNG */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #start-btn {
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            background-color: #f1c40f;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
        }

        /* --- UI NÚT BẤM CHO ĐIỆN THOẠI --- */
        .mobile-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 10;
        }

        /* Cụm di chuyển bên trái */
        .d-pad {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            grid-template-areas: 
                ". up ."
                "left . right";
            gap: 10px;
        }

        /* Cụm tấn công bên phải */
        .action-pad {
            display: grid;
            grid-template-columns: 65px 80px;
            grid-template-rows: 65px 65px;
            grid-template-areas: 
                "punch kame"
                "gong kame";
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            user-select: none;
        }

        .btn:active { background: rgba(255, 255, 255, 0.6); }

        #btn-up { grid-area: up; }
        #btn-left { grid-area: left; }
        #btn-right { grid-area: right; }
        
        #btn-punch { grid-area: punch; font-size: 14px; background: rgba(52, 152, 219, 0.6); }
        #btn-gong { grid-area: gong; font-size: 14px; background: rgba(241, 196, 15, 0.6); }
        
        #btn-kame {
            grid-area: kame;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            background: rgba(231, 76, 60, 0.6);
            border-color: rgba(231, 76, 60, 0.8);
            font-size: 18px;
        }
        #btn-kame:active { background: rgba(231, 76, 60, 0.9); }
    </style>
</head>
<body>

    <div id="start-screen">
        <button id="start-btn">BẮT ĐẦU CHƠI</button>
    </div>

    <div id="game-container">
        <div id="player"></div>
        
        <div class="mobile-controls">
            <div class="d-pad">
                <div class="btn" id="btn-up">▲</div>
                <div class="btn" id="btn-left">◀</div>
                <div class="btn" id="btn-right">▶</div>
            </div>
            <div class="action-pad">
                <div class="btn" id="btn-punch">Đấm</div>
                <div class="btn" id="btn-gong">Gồng</div>
                <div class="btn" id="btn-kame">Kame</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('dragstart', event => event.preventDefault());

        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');

        startBtn.addEventListener('click', async () => {
            startScreen.style.display = 'none'; 
            
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                await elem.requestFullscreen().catch(err => console.log(err));
            } else if (elem.webkitRequestFullscreen) { 
                await elem.webkitRequestFullscreen().catch(err => console.log(err));
            }

            if (screen.orientation && screen.orientation.lock) {
                try {
                    await screen.orientation.lock('landscape');
                } catch (error) {
                    console.log("Thiết bị không hỗ trợ tự động xoay, vui lòng xoay tay.");
                }
            }
        });

        const player = document.getElementById('player');
        
        // CẬP NHẬT SỐ LƯỢNG FRAME THEO ĐÚNG ẢNH BẠN ĐANG CÓ
        const animations = {
            stand: { prefix: 'stand_', frames: 2, speed: 200 }, /* 2 ảnh, chỉnh speed chậm lại 1 chút để đứng thở tự nhiên hơn */
            punch: { prefix: 'punch_', frames: 4, speed: 100 }, /* 4 ảnh */
            sit:   { prefix: 'sit_', frames: 3, speed: 150 }, /* 3 ảnh */
            skill: { prefix: 'skill_', frames: 7, speed: 100 }  /* 7 ảnh */
        };

        // --- CƠ CHẾ TẢI TRƯỚC ẢNH (CHỐNG NHẤP NHÁY) ---
        const imageCache = [];
        function preloadImages() {
            for (const key in animations) {
                const anim = animations[key];
                for (let i = 1; i <= anim.frames; i++) {
                    const img = new Image();
                    img.src = `${anim.prefix}${i}.png`;
                    imageCache.push(img);
                }
            }
        }
        preloadImages(); 

        let currentAction = 'stand';
        let currentFrame = 1;
        let animationInterval;
        let playerX = 50; 
        let isJumping = false;
        let moveInterval; 

        function playAnimation(action) {
            if (currentAction === action) return; 
            currentAction = action;
            currentFrame = 1;
            clearInterval(animationInterval);
            
            // Render khung hình đầu tiên ngay lập tức
            player.style.backgroundImage = `url('${animations[action].prefix}${currentFrame}.png')`;
            
            animationInterval = setInterval(() => {
                currentFrame++;
                if (currentFrame > animations[action].frames) currentFrame = 1;
                player.style.backgroundImage = `url('${animations[action].prefix}${currentFrame}.png')`;
            }, animations[action].speed);
        }

        playAnimation('stand'); 

        // --- HÀM DI CHUYỂN & NHẢY ---
        function startMoving(direction) {
            clearInterval(moveInterval);
            moveInterval = setInterval(() => {
                if (direction === 'left' && playerX > 0) {
                    playerX -= 15; 
                } else if (direction === 'right' && playerX < window.innerWidth - 250) {
                    playerX += 15; 
                }
                player.style.left = playerX + 'px';
            }, 50); 
        }

        function stopMoving() {
            clearInterval(moveInterval);
        }

        function jump() {
            if (isJumping) return;
            isJumping = true;
            player.style.bottom = '40%';
            
            setTimeout(() => {
                player.style.bottom = '10%';
                setTimeout(() => { isJumping = false; }, 300); 
            }, 400);
        }

        // --- BẮT SỰ KIỆN NÚT BẤM CẢM ỨNG ---
        
        // Di chuyển
        document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); startMoving('left'); });
        document.getElementById('btn-left').addEventListener('touchend', (e) => { e.preventDefault(); stopMoving(); });

        document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); startMoving('right'); });
        document.getElementById('btn-right').addEventListener('touchend', (e) => { e.preventDefault(); stopMoving(); });

        document.getElementById('btn-up').addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });

        // Tấn công / Hành động
        document.getElementById('btn-punch').addEventListener('touchstart', (e) => { e.preventDefault(); playAnimation('punch'); });
        document.getElementById('btn-punch').addEventListener('touchend', (e) => { e.preventDefault(); playAnimation('stand'); });

        document.getElementById('btn-gong').addEventListener('touchstart', (e) => { e.preventDefault(); playAnimation('sit'); });
        document.getElementById('btn-gong').addEventListener('touchend', (e) => { e.preventDefault(); playAnimation('stand'); });

        document.getElementById('btn-kame').addEventListener('touchstart', (e) => { e.preventDefault(); playAnimation('skill'); });
        document.getElementById('btn-kame').addEventListener('touchend', (e) => { e.preventDefault(); playAnimation('stand'); });

    </script>
</body>
</html>
